name: Legal Reconnaissance Watchdog 24/7

on:
  schedule:
    # Chạy tự động mỗi sáng lúc 07:00 (Giờ VN) từ Thứ 2 đến Thứ 6
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  recon_and_alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install httpx feedparser beautifulsoup4 urllib3

      - name: Run Legal Reconnaissance Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python recon_pipeline.py
