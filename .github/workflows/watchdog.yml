name: Legal Reconnaissance Watchdog 24/7

on:
  schedule:
    # Chạy tự động mỗi sáng lúc 07:00 (Giờ VN = 00:00 UTC) từ Thứ 2 đến Thứ 6
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ chạy'
        required: true
        default: 'test_ai'
        type: choice
        options:
          - test_ai
          - recon

permissions:
  contents: write

jobs:
  recon_and_alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Legal Reconnaissance & AI Diff Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.mode }}" = "recon" ]; then
            echo "Running automated daily reconnaissance..."
            python recon_pipeline.py
          else
            echo "Running live AI deep analysis test..."
            python test_live_ai.py
          fi

      - name: Commit and Save State
        run: |
          git config --global user.name "LegalReconBot"
          git config --global user.email "bot@legal-recon.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update: Legal state [skip ci]"
            git push
          fi
